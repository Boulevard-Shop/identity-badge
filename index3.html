<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identity Badge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f8;
      user-select: none;
      -webkit-user-select: none;
    }
    .title-font {
      font-family: 'Bodoni Moda', 'Playfair Display', Georgia, serif;
    }
    .emaar-font {
      font-family: 'Bodoni Moda', 'Times New Roman', serif;
      letter-spacing: 0.18em;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-gray-100">

  <!-- Mobile Container -->
  <div class="w-full max-w-[420px] bg-[#fbfbfb] min-h-screen sm:min-h-[880px] sm:rounded-[40px] shadow-2xl relative flex flex-col justify-between p-6 pb-10 overflow-hidden border border-gray-200">
    
    <!-- Top Back Arrow -->
    <div class="absolute top-6 left-6 cursor-pointer z-20">
      <span class="text-2xl font-light text-black">&lt;</span>
    </div>

    <!-- Main Content Area -->
    <div class="flex flex-col items-center pt-2">
      
      <!-- Title -->
      <h1 class="title-font text-[28px] font-semibold text-black tracking-wide my-4 text-center">
        Identity Badge
      </h1>

      <!-- Avatar Section -->
      <div class="relative mt-2 mb-[-60px] z-10 flex justify-center items-center">
        <div class="w-[280px] h-[280px] rounded-full border-[3px] border-[#81c784] p-[3px] flex items-center justify-center bg-transparent">
          <div class="w-full h-full rounded-full overflow-hidden flex items-center justify-center bg-gray-200">
            <img 
              src="https://i.postimg.cc/bvCK6Hkq/IMG-5696.jpg" 
              alt="Profile Picture" 
              class="w-full h-full object-cover"
            >
          </div>
        </div>
      </div>

      <!-- Badge Card Container -->
      <div class="w-full rounded-[28px] overflow-hidden shadow-sm flex flex-col pt-[70px] bg-[#eceef2]">
        
        <!-- Username & Type Green Bar (Full Width Straight Rectangle) -->
        <div class="bg-[#a2d8a5] px-5 py-3 flex justify-between items-center w-full">
          <div>
            <div class="text-[13px] text-[#2e5d32] font-medium leading-tight">Username</div>
            <div class="text-[18px] font-bold text-black leading-tight mt-0.5">Ali Abdelaziz</div>
          </div>
          <div class="text-right">
            <div class="text-[13px] text-[#2e5d32] font-medium leading-tight">Type</div>
            <div class="text-[18px] font-bold text-black leading-tight mt-0.5">Resident</div>
          </div>
        </div>

        <!-- Unit & QR Code Section -->
        <div class="p-5 flex justify-between items-center bg-[#eceef2]">
          <div class="flex-1 pr-2">
            <div class="text-[13px] text-[#6e7179] font-medium leading-tight">Unit</div>
            <div class="text-[15px] font-bold text-black leading-tight mt-1 whitespace-nowrap overflow-hidden text-ellipsis">
              Boulevard Residence 2-D-3-5
            </div>
          </div>
          <div class="bg-white p-1.5 rounded-lg shadow-sm border border-gray-200/60 flex-shrink-0">
            <svg class="w-8 h-8 text-black" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2 2h8v8H2V2zm2 2v4h4V4H4zm11-2h8v8h-8V2zm2 2v4h4V4h-4zM2 14h8v8H2v-8zm2 2v4h4v-4H4zm13-2h2v2h-2v-2zm-2 2h2v2h-2v-2zm4 0h2v2h-2v-2zm-2 2h2v2h-2v-2zm2 2h2v2h-2v-2zm-4 0h2v2h-2v-2zm2-6h2v2h-2v-2z"/>
            </svg>
          </div>
        </div>

      </div>

      <!-- Open Gate Action Button -->
      <div class="w-full mt-6">
        <button 
          id="openGateBtn" 
          onclick="startCountdown()" 
          class="w-full bg-[#6d7177] hover:bg-[#5a5e63] active:scale-[0.99] text-white font-medium text-[17px] py-3.5 rounded-xl shadow-sm transition-all duration-150 flex items-center justify-center tracking-wide"
        >
          Open Gate
        </button>
      </div>

      <!-- Legal Warning Text -->
      <p class="text-[12px] text-[#4a4d52] text-center mt-5 px-4 leading-relaxed font-normal">
        Any proven manipulation of this identity will result in a<br>
        EGP 30,000 fine and user suspension.
      </p>

    </div>

    <!-- Footer Branding -->
    <div class="flex flex-col items-center mt-8 pb-2">
      <div class="emaar-font text-[22px] font-semibold text-[#3a3d42] tracking-[0.25em] pl-[0.25em]">
        EMAAR
      </div>
      <div class="text-[10px] text-[#8e929a] font-medium tracking-[0.3em] pl-[0.3em] -mt-0.5">
        MISR
      </div>
    </div>

  </div>

  <script>
    let isCounting = false;
    let countdownTimer = null;

    function startCountdown() {
      if (isCounting) return;
      isCounting = true;

      const btn = document.getElementById('openGateBtn');
      let secondsLeft = 5;

      btn.innerText = `Opening gate in ${secondsLeft}...`;
      btn.classList.add('opacity-90', 'cursor-not-allowed');

      countdownTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          btn.innerText = `Opening gate in ${secondsLeft}...`;
        } else {
          clearInterval(countdownTimer);
          btn.innerText = "Gate Opened!";
          btn.classList.remove('bg-[#6d7177]');
          btn.classList.add('bg-emerald-600');

          setTimeout(() => {
            btn.innerText = "Open Gate";
            btn.classList.remove('bg-emerald-600', 'opacity-90', 'cursor-not-allowed');
            btn.classList.add('bg-[#6d7177]');
            isCounting = false;
          }, 2000);
        }
      }, 1000);
    }
  </script>

</body>
</html>
